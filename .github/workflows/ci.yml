name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The tests start real zsh, bash, vim and git in a PTY, so they run on macOS like the app.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable
      - run: cargo test --locked
